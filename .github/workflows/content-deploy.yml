name: Deploy CV (Content Branch)

on:
  push:
    branches: [ content ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs on the same ref (e.g. rapid content pushes)
concurrency:
  group: content-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Quick Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v5
        with:
          ref: content

      - name: Checkout main branch code
        run: |
          echo "📥 Fetching main branch code..."
          git fetch origin main
          git checkout origin/main -- .
          # Restore content branch data, config, and static assets
          git checkout content -- data/
          git checkout content -- config/ 2>/dev/null || echo "ℹ️  No config/ on content branch, using defaults from main"
          git checkout content -- img/ 2>/dev/null || echo "ℹ️  No img/ on content branch"
          git checkout content -- static/ 2>/dev/null || echo "ℹ️  No static/ on content branch"
          echo "✅ Code and content merged successfully."

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', 'src/**/*.rs', 'Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Install required fonts
        run: |
          echo "📥 Installing fonts for PDF generation..."

          # Install Font Awesome for icons
          echo "Downloading Font Awesome..."
          wget -q https://github.com/FortAwesome/Font-Awesome/releases/download/6.5.1/fontawesome-free-6.5.1-desktop.zip
          unzip -q fontawesome-free-6.5.1-desktop.zip
          sudo mkdir -p /usr/share/fonts/truetype/fontawesome
          sudo cp fontawesome-free-6.5.1-desktop/otfs/*.otf /usr/share/fonts/truetype/fontawesome/

          # Install HK Grotesk from repo
          echo "Installing HK Grotesk from static/fonts..."
          sudo mkdir -p /usr/share/fonts/opentype/hkgrotesk
          sudo cp static/fonts/HKGrotesk/*.otf /usr/share/fonts/opentype/hkgrotesk/

          # Update font cache
          echo "Updating font cache..."
          sudo fc-cache -f
          fc-list | grep -i "HK Grotesk" | head -3 || echo "⚠️ HK Grotesk not found in font cache"
          echo "✅ Fonts installed (HK Grotesk + Font Awesome)"

      - name: Build CV generator (release mode)
        run: cargo build --release --bin cv

      - name: Generate CV files
        run: |
          echo "🚀 Generating CV with updated content..."
          cargo run --release --bin cv
          echo "✅ CV generation successful."
          echo "🔍 Verifying output files..."
          test -f dist/cv.html && echo "  - cv.html found."
          test -f dist/cv.pdf && echo "  - cv.pdf found."
          test -f dist/index.html && echo "  - index.html found."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload CV artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "🎉 Content deployment completed!"
          echo "📊 Build optimized for content-only changes"
          echo "⚡ Skipped: code formatting, linting, and tests"
          echo "🔗 Site URL: ${{ steps.deployment.outputs.page_url }}"