name: CV Generator CI (Main Branch)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel superseded runs on the same ref (e.g. rapid pushes / PR updates)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Check code formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy linter (release)
        run: cargo clippy --release --all-targets --all-features -- -D warnings
      - name: Run tests (release)
        run: cargo test --release --verbose

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit
      - name: Run security audit
        run: cargo audit

  build:
    name: Build CV
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-release-
      - name: Install Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"
      - name: Install required fonts
        run: |
          echo "Installing fonts for PDF generation..."
          sudo mkdir -p /usr/share/fonts/truetype/cv-fonts
          sudo cp fonts/*.otf fonts/*.ttf /usr/share/fonts/truetype/cv-fonts/
          sudo fc-cache -f
      - name: Fetch content from 'content' branch
        run: |
          git fetch origin content
          git checkout origin/content -- data/
          git checkout origin/content -- config/ 2>/dev/null || echo "No config/ on content branch, using defaults"
          git checkout origin/content -- img/ 2>/dev/null || echo "No img/ on content branch, will use GitHub avatar"
      - name: Generate CV files
        run: |
          cargo run --release --bin cv
          test -f dist/cv.html && echo "  - cv.html found."
          test -f dist/cv.pdf && echo "  - cv.pdf found."
          test -f dist/index.html && echo "  - index.html found."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload CV artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
