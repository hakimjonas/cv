name: CV Generator CI (Main Branch)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check code formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  build:
    name: Build and Deploy CV
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Typst CLI
        uses: typst-community/setup-typst@v5
        with:
          typst-version: "0.14.2"

      - name: Install required fonts
        run: |
          echo "📥 Installing fonts for PDF generation..."
          sudo mkdir -p /usr/share/fonts/truetype/cv-fonts
          sudo cp fonts/*.otf fonts/*.ttf /usr/share/fonts/truetype/cv-fonts/
          sudo fc-cache -f
          echo "✅ Fonts installed from repository"

      - name: Build CV generator
        run: cargo build --release --bin cv

      - name: Fetch content from 'content' branch
        run: |
          echo "📥 Fetching content branch..."
          git fetch origin content
          echo "📋 Checking out content from content branch..."
          git checkout origin/content -- data/
          git checkout origin/content -- config/ 2>/dev/null || echo "ℹ️  No config/ on content branch, using defaults"
          git checkout origin/content -- img/ 2>/dev/null || echo "ℹ️  No img/ on content branch, will use GitHub avatar"
          echo "✅ Successfully fetched content."

      - name: Generate CV files
        run: |
          cargo run --bin cv
          echo "✅ CV generation successful."
          echo "🔍 Verifying output files..."
          test -f dist/cv.html && echo "  - cv.html found."
          test -f dist/cv.pdf && echo "  - cv.pdf found."
          test -f dist/index.html && echo "  - index.html found."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload CV artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          echo "🎉 Main branch deployment completed!"
          echo "✅ Full code quality checks passed"
          echo "🧪 All tests passed"
          echo "🔗 Site URL: ${{ steps.deployment.outputs.page_url }}"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install cargo-audit
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-audit

      - name: Run security audit
        run: cargo audit